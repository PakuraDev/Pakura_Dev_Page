<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pakura Bento - Cáustica WebGL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Pantalla principal temporal (blanca con botón 'Ver el mar') -->
  <div id="welcomeScreen" class="welcome-screen">
    <button id="btnVerMar" class="btn-ver-mar">Ver el mar</button>
  </div>

  <canvas id="glCanvas"></canvas>
  <div id="lilyPadsContainer" class="lily-pads-container"></div>

  <!-- Audio de fondo ambiental -->
  <audio id="bgAudio" loop preload="auto">
    <source src="assets/water/sound.opus" type="audio/ogg; codecs=opus" />
    <source src="assets/water/sound.mp3" type="audio/mpeg" />
  </audio>

  <script src="main.js"></script>
</body>
</html>

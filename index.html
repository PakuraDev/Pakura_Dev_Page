<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pakura Bento - Cáustica WebGL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Contenedor de la página principal -->
  <div id="pageContainer" class="page-container">
    <header class="app-header">
      <a href="https://github.com/PakuraDev" target="_blank" rel="noopener noreferrer" class="header-btn" aria-label="GitHub" title="GitHub">
        <img src="assets/icons/github.svg" alt="GitHub" width="22" height="22" />
      </a>

      <p class="status-phrase">
        <span class="phrase-desktop">No lo quería decir, pero joder, que calor hace en sevilla</span>
        <span class="phrase-mobile">Hace calor</span>
      </p>

      <button id="btnVerMar" class="header-btn" aria-label="Ver el mar" title="Ver el mar">
        <img src="assets/icons/wave.svg" alt="Ver el mar" width="22" height="22" />
      </button>
    </header>

    <!-- Contenedor central (Bento / Linktree placeholder) -->
    <main class="bento-container">
      <!-- Contenido en construcción -->
    </main>
  </div>

  <canvas id="glCanvas"></canvas>
  <div id="lilyPadsContainer" class="lily-pads-container"></div>

  <!-- Audio de fondo ambiental -->
  <audio id="bgAudio" loop preload="auto">
    <source src="assets/water/sound.opus" type="audio/ogg; codecs=opus" />
    <source src="assets/water/sound.mp3" type="audio/mpeg" />
  </audio>

  <script src="main.js"></script>
</body>
</html>
